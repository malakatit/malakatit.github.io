<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Malak Atitallah</title>

    <link rel="stylesheet" href="style.css">
    <script src="to-do.js" defer></script>
</head>

<body>

    <main class="page">

        <header class="intro">
            <h1 class="name">My To-Do List</h1>
            <p class="back-link"><a href="index.html">Back to homepage</a></p>
        </header>

        <section class="todo-section">
            <ul class="todo-list">
                <!-- List items will go here -->
            </ul>

            <div class="todo-form">
                <input type="text" id="new-todo" placeholder="Add a new item">
                <button type="button" id="add-todo">Add To Do</button>
            </div>

            <div class="todo-footer">
                <button type="button" id="clear-todos">Clear All</button>
            </div>
        </section>

         <footer class="page-footer">
            <p>&copy; 2026 Malak Atitallah</p>
        </footer>


    </main>

</body>
</html>
